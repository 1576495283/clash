
[General]
bypass-system = true
skip-proxy = 192.168.0.0/16,10.0.0.0/8,127.0.0.1/8,172.16.0.0/12,localhost
dns-server = system,223.5.5.5,8.8.8.8
fallback-dns = 1.1.1.1,9.9.9.9
dns-fallback = true
ipv6 = false
always-real-ip = apple.com,icloud.com

[Proxy Group]
# 港澳台节点自动分组，导入后在 Shadowrocket → 编辑分组 → 按关键字“港|HK|香港|Hong Kong”添加对应节点
🇭🇰 香港自动 = select, DIRECT
# 狮城节点自动分组，关键字“SG|🇸🇬|Singapore”
🇸🇬 狮城自动 = select, DIRECT
# 日本节点自动分组，关键字“JP|🇯🇵|Japan”
🇯🇵 日本自动 = select, DIRECT
# 美股或美区节点自动分组，关键字“US|🇺🇸|America|USA”
🇺🇸 美国自动 = select, DIRECT

苹果服务 = select, 🇭🇰 香港自动, 🇸🇬 狮城自动, 🇯🇵 日本自动, 🇺🇸 美国自动, DIRECT
奈飞 = select, 节点选择, DIRECT
油管 = select, 节点选择, DIRECT
Emby = select, 节点选择, DIRECT
Github = select, 节点选择, DIRECT
国内网站 = select, DIRECT, 节点选择
漏网之鱼 = select, 节点选择, DIRECT

[Rule]
# 基础规则集
RULE-SET,applications,DIRECT
RULE-SET,private,DIRECT
RULE-SET,reject,REJECT
# 应用分流
RULE-SET,icloud,苹果服务
RULE-SET,apple,苹果服务
# 网络分流
RULE-SET,google,节点选择
RULE-SET,proxy,节点选择
RULE-SET,direct,DIRECT
RULE-SET,lancidr,DIRECT
RULE-SET,cncidr,国内网站
RULE-SET,telegramcidr,节点选择
# 媒体分流
RULE-SET,Netflix,奈飞
RULE-SET,YouTube,油管
RULE-SET,Emby,Emby
RULE-SET,Github,Github
# 自定义 OpenClash 规则（4000+ 条）引用：请将你的 OpenClash 规则导出为单个 YAML 并部署到可访问 URL
RULE-SET,custom_rules,自定义规则
MATCH,漏网之鱼

[Rule Set]
applications = https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.yaml
private = https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.yaml
reject = https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.yaml
icloud = https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.yaml
apple = https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.yaml
google = https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.yaml
proxy = https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.yaml
direct = https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.yaml
lancidr = https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.yaml
cncidr = https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.yaml
telegramcidr = https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.yaml
Netflix = https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/Netflix.yaml
YouTube = https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/YouTube.yaml
Emby = https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/Emby.yaml
Github = https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/Github.yaml
自定义规则 = https://yourdomain.com/path/to/custom_rules.yaml
