# ========================
# 主要端口设置
# ========================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895

allow-lan: true
mode: rule
log-level: info

external-controller: 0.0.0.0:9090
#external-ui: ui
#external-ui-name: zashboard
#external-ui-url: https://gh-proxy.com/github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
secret: "898989"

# ========================
# 统一延迟、TCP并发、减少反复握手设置
# ========================
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 30
keep-alive-idle: 30
disable-keep-alive: false

