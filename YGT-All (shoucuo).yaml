# ========================
# 策略组定义
# ========================
default: &default
  type: select
  proxies:
    - 直连
    - 所有-手动
    - 所有-自动
    - 搬瓦工-故转
    - 搬瓦工-手动
    - 搬瓦工-自动
    - 香港-故转
    - 实验-手动
    - 实验-故转
    - 台湾-故转
    - 日本-故转
    - 新加坡-故转
    - 韩国-故转
    - 美国-故转
    - 英国-故转
    - 印度-故转
    - CF-故转
    - 其他-故转
    - 拒绝

proxy-groups:

  # 业务分流组
  
