  - name: 所有-手动
    type: select
    include-all: true
    filter: "^((?!(直连|拒绝)).)*$"

  - name: 所有-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    timeout: 5000
    max-failed-times: 3
    expected-status: 204
    filter: "^((?!(直连|拒绝)).)*$"

  # 搬瓦工组
  - name: 搬瓦工-故转
    type: fallback
    interval: 300
    lazy: false
